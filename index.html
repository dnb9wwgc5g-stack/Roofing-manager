<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2945"><title>Commercial Roofing Manager — V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#0b2945;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
main{max-width:1100px;margin:auto;padding:14px 14px 90px}h2,h3{margin:0 0 6px}.small{font-size:12px;color:#6b7682}.whiteSmall{font-size:12px;color:#c8d5e1}
.card{background:#fff;border:1px solid #d9e0e6;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0000000a}
.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
button,input,select{font:inherit}button{border:1px solid #c9d2da;background:#fff;border-radius:9px;padding:9px 12px}button.primary{background:#1769aa;color:#fff;border-color:#1769aa}
input,select{width:100%;border:1px solid #cbd4dc;border-radius:9px;padding:9px;background:#fff}label{font-size:12px;font-weight:700;display:block;margin:8px 0 4px}
.kpi{font-size:25px;font-weight:800}.row,.between{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.progress{height:9px;background:#e8edf1;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#16834a}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e0e6;display:flex;justify-content:center;gap:4px;padding:7px;z-index:10}nav button{flex:1;max-width:180px;border:0}.active{background:#e8f1f9!important;color:#1769aa;font-weight:700}
.hidden{display:none!important}.note{background:#fff8df;border:1px solid #eedb98;border-radius:10px;padding:10px;font-size:13px}
#map{width:100%;height:400px;border-radius:12px;background:#d9e2e8;position:relative;overflow:hidden;border:1px solid #c9d2da}#map img{width:100%;height:100%;object-fit:cover}.mapOverlay{position:absolute;inset:0}
.area{position:absolute;background:#16834a55;border:2px solid #16834a;display:flex;align-items:center;justify-content:center;color:#06351e;font-weight:800}.detail{position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #1769aa;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.op{background:#f7fafc;border:1px solid #dce4ea;border-radius:10px;padding:10px;margin-top:8px}.skillGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.skillGrid label{font-weight:500;margin:0}.skillGrid input{width:auto}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#e8f1f9;color:#1769aa;font-size:11px;margin:2px}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}.skillGrid{grid-template-columns:1fr}#map{height:320px}}
</style></head><body>
<header><div><b>Commercial Roofing Manager</b><div class="whiteSmall">V4 • GitHub Pages • Roofing squares are primary</div></div><div id="saved" class="whiteSmall">Ready</div></header>
<main><section id="dash"></section><section id="projects" class="hidden"></section><section id="project" class="hidden"></section><section id="crew" class="hidden"></section></main>
<nav><button data-p="dash">Dashboard</button><button data-p="projects">Projects</button><button data-p="crew">Crew</button></nav>
<script>
const KEY="crm_mvp_v4";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{projects:[],crew:[],selected:null};
const $=id=>document.getElementById(id),id=()=>Math.random().toString(36).slice(2,9),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));$("saved").textContent="Saved "+new Date().toLocaleTimeString()};
const CLASS_FACTORS={"Foreman":1.10,"Journeyman":1,"90% Apprentice":.9,"80% Apprentice":.8,"70% Apprentice":.7,"60% Apprentice":.6};
const CAPS=["EPDM — Field Layup","EPDM — Detail Completion","EPDM — Flashing","EPDM — Seaming","EPDM — Penetrations","EPDM — Drains","TPO — Field Layup","TPO — Detail Completion","TPO — Flashing","TPO — Seaming","TPO — Penetrations","TPO — Drains","Fleece-Back EPDM — Field Layup","Fleece-Back EPDM — Detail Completion","Fleece-Back TPO — Field Layup","Fleece-Back TPO — Detail Completion","PVC — Field Layup","PVC — Detail Completion","PVC — Flashing","PVC — Seaming","Mechanically Fastened Insulation","Foam-Adhered Insulation","Fully Adhered Insulation","Tapered Insulation","Cover Board","Vapor Barrier","Base Sheet","Tear-Off","Metal Flashing"];
const ATT=["Mechanically Fastened","Foam Adhered","Fully Adhered / Glued","Self-Adhered","Hot Asphalt","Cold Adhesive","Induction Welded","Other"],LAY=["Vapor Barrier","Insulation","Tapered Insulation","Cover Board","Base Sheet","Membrane","Protection Layer","Other"];
function crewFor(p){return S.crew.filter(c=>p.crew.includes(c.id))}
function rate(p,t){let b=+t.rate||0,cs=crewFor(p).filter(c=>(c.capabilities||[]).includes(t.capability));if(!cs.length)return b;return b*cs.reduce((a,c)=>a+(CLASS_FACTORS[c.classification]||1),0)/cs.length}
function stats(p){let total=p.operations.reduce((a,t)=>a+(+t.qty||0),0),done=p.operations.reduce((a,t)=>a+(+t.done||0),0),pct=total?done/total*100:0,actual=p.costs.reduce((a,c)=>a+(+c.amount||0),0),rem=p.operations.reduce((a,t)=>a+Math.max(0,(+t.qty||0)-(+t.done||0))*(+t.cost||0),0),days=p.operations.reduce((a,t)=>a+(rate(p,t)?Math.max(0,(+t.qty||0)-(+t.done||0))/rate(p,t):0),0),finish=new Date();finish.setDate(finish.getDate()+Math.ceil(days));return{total,done,pct,actual,rem,profit:(+p.contract||0)-actual-rem,days,finish}}
function nav(p){document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));$(p).classList.remove("hidden");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));render(p)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.p));function render(p){({dash,projects,project,crew}[p])()}
function dash(){let ps=S.projects.filter(p=>p.status!=="Completed"),cv=ps.reduce((a,p)=>a+(+p.contract||0),0),pf=ps.reduce((a,p)=>a+stats(p).profit,0);$("dash").innerHTML=`<div class="between"><div><h2>Dashboard</h2><div class="small">Commercial roofing production management • <b>V4</b></div></div><button class="primary" onclick="newProject()">+ New Project</button></div><div class="grid three"><div class="card"><div class="small">Active projects</div><div class="kpi">${ps.length}</div></div><div class="card"><div class="small">Contract value</div><div class="kpi">$${cv.toLocaleString()}</div></div><div class="card"><div class="small">Projected profit</div><div class="kpi">$${Math.round(pf).toLocaleString()}</div></div></div><div class="card"><h3>Active projects</h3>${ps.map(p=>{let x=stats(p);return`<div class="card"><div class="between"><div><b>${esc(p.name)}</b><div class="small">${esc(p.system)} • ${esc(p.address)}</div></div><button onclick="openProject('${p.id}')">Open</button></div><div>${x.pct.toFixed(0)}% complete • ${x.done.toFixed(1)} / ${x.total.toFixed(1)} squares</div><div class="progress"><i style="width:${x.pct}%"></i></div><div class="small">Predicted field completion: ${x.finish.toLocaleDateString()} • Sales labor budget: ${(+p.laborHours||0).toLocaleString()} man-hours</div></div>`}).join("")||"<div class='small'>Create a project to begin.</div>"}</div>`}
function projects(){$("projects").innerHTML=`<div class="between"><div><h2>Projects</h2><div class="small">Sales estimate, actual production, costs and forecast</div></div><button class="primary" onclick="newProject()">+ New Project</button></div><div class="grid">${S.projects.map(p=>{let x=stats(p);return`<div class="card"><div class="between"><div><h3>${esc(p.name)}</h3><div class="small">${esc(p.number)} • ${esc(p.system)}</div></div><button onclick="openProject('${p.id}')">Open</button></div><div>${x.pct.toFixed(1)}% complete • ${x.total.toFixed(1)} squares • $${Math.round(x.profit).toLocaleString()} projected profit</div><div class="small">Predicted field completion: ${x.finish.toLocaleDateString()}</div></div>`}).join("")}</div>`}
function newProject(){let p={id:id(),name:"New Commercial Project",number:"",address:"",system:"TPO",contract:0,status:"In Progress",laborHours:0,actualLaborHours:0,crew:[],operations:[],costs:[],details:[],map:"",snapshots:[],assemblies:[]};S.projects.push(p);S.selected=p.id;save();nav("project")}
function openProject(x){S.selected=x;nav("project")}
function project(){let p=S.projects.find(x=>x.id===S.selected);if(!p)return nav("projects");let x=stats(p);$("project").innerHTML=`<div class="between"><div><h2>${esc(p.name)}</h2><div class="small">${esc(p.system)} • ${esc(p.address)}</div></div><button onclick="nav('projects')">Back</button></div>
<div class="grid three"><div class="card"><div class="small">Actual progress</div><div class="kpi">${x.pct.toFixed(0)}%</div><div>${x.done.toFixed(1)} / ${x.total.toFixed(1)} squares</div></div><div class="card"><div class="small">Predicted field completion</div><div class="kpi">${x.finish.toLocaleDateString()}</div><div>${x.days.toFixed(1)} production days remaining</div></div><div class="card"><div class="small">Projected final profit</div><div class="kpi">$${Math.round(x.profit).toLocaleString()}</div></div></div>
<div class="card"><h3>Sales estimate vs. field reality</h3><div class="grid two"><div><label>Sales estimated labor budget (man-hours)</label><input id="lh" type="number" value="${p.laborHours}"><div class="small">Original sales estimate. It does not change based on crew classification.</div></div><div><label>Actual labor hours to date</label><input id="alh" type="number" value="${p.actualLaborHours}"><div class="small">Field reality used for historical learning.</div></div></div><button class="primary" style="margin-top:10px" onclick="saveHours()">Save labor hours</button></div>
<div class="card"><h3>Project information</h3><div class="grid two"><div><label>Project name</label><input id="pn" value="${esc(p.name)}"><label>Project number</label><input id="pnum" value="${esc(p.number)}"><label>Address</label><input id="pa" value="${esc(p.address)}"></div><div><label>Primary roof system</label><select id="ps">${["TPO","Fleece-Back TPO","PVC","EPDM","Fleece-Back EPDM","Modified Bitumen","BUR","Other"].map(v=>`<option ${v===p.system?"selected":""}>${v}</option>`).join("")}</select><label>Contract value</label><input id="pc" type="number" value="${p.contract}"></div></div><button class="primary" style="margin-top:10px" onclick="saveInfo()">Save project</button></div>
<div class="card"><div class="between"><div><h3>Interactive overhead</h3><div class="small">Upload an aerial, add roof areas and daily completion.</div></div><input type="file" accept="image/*" onchange="uploadMap(event)" style="max-width:240px"></div><div class="note">Roof-area quantities are entered in <b>roofing squares</b>. 1 square = 100 SF.</div><div id="map">${p.map?`<img src="${p.map}">`:"<div style='height:100%;display:flex;align-items:center;justify-content:center;color:#66717d'>Upload an overhead image to begin</div>"}<div class="mapOverlay" id="overlay"></div></div><div class="row" style="margin-top:8px"><button onclick="measureArea()">Add roof area (squares)</button><button onclick="markArea()">Mark completed area</button><button onclick="dailySnapshot()">Save daily snapshot</button><button onclick="addDetail('Roof Drain')">+ Drain</button><button onclick="addDetail('HVAC Curb')">+ Curb</button><button onclick="addDetail('Pipe Penetration')">+ Penetration</button></div><div id="snapshotList" class="small" style="margin-top:8px"></div></div>
<div class="card"><div class="between"><div><h3>Roof Assembly Builder</h3><div class="small">Material layers and installation operations are separate concepts. Multiple materials can share one installation operation.</div></div><button class="primary" onclick="addAssembly()">+ Add Roof Assembly</button></div>${(p.assemblies||[]).map((a,ai)=>assemblyHTML(a,ai)).join("")||"<div class='small'>No assemblies yet.</div>"}</div>
<div class="card"><div class="between"><div><h3>Production operations</h3><div class="small">These operations drive the field completion forecast.</div></div><button onclick="addOperation()">+ Add Operation</button></div>${p.operations.map((t,i)=>`<div class="op"><div class="grid two"><div><label>Operation</label><input id="on${i}" value="${esc(t.name)}"><label>Capability required</label><select id="oc${i}"><option value="">—</option>${CAPS.map(v=>`<option ${v===t.capability?"selected":""}>${esc(v)}</option>`).join("")}</select></div><div><label>Quantity (squares)</label><input id="oq${i}" type="number" value="${t.qty}"><label>Completed (squares)</label><input id="od${i}" type="number" value="${t.done}"></div></div><div class="grid three"><div><label>Baseline production (squares/day)</label><input id="or${i}" type="number" value="${t.rate}"></div><div><label>Remaining cost / square</label><input id="ocost${i}" type="number" value="${t.cost}"></div><div><label>Current crew-adjusted rate</label><div class="kpi" style="font-size:18px">${rate(p,t).toFixed(1)} sq/day</div></div></div><button onclick="saveOp(${i})">Save</button> <button onclick="delOp(${i})">Delete</button></div>`).join("")||"<div class='small'>Add operations after building assemblies.</div>"}</div>
<div class="grid two"><div class="card"><div class="between"><h3>Actual costs</h3><button onclick="addCost()">+ Add</button></div>${p.costs.map((c,i)=>`<div class="row"><input id="cn${i}" value="${esc(c.name)}"><input id="ca${i}" type="number" value="${c.amount}"><button onclick="saveCost(${i})">Save</button><button onclick="delCost(${i})">×</button></div>`).join("")}<hr><div class="between"><span>Actual costs</span><b>$${x.actual.toLocaleString()}</b></div><div class="between"><span>Remaining forecast</span><b>$${Math.round(x.rem).toLocaleString()}</b></div></div><div class="card"><h3>Profit forecast</h3><div class="between"><span>Contract</span><b>$${(+p.contract||0).toLocaleString()}</b></div><div class="between"><span>Projected final profit</span><b>$${Math.round(x.profit).toLocaleString()}</b></div></div></div>
<div class="card"><h3>Crew assignment</h3><div class="grid three">${S.crew.map(c=>`<label><input type="checkbox" ${p.crew.includes(c.id)?"checked":""} onchange="toggleCrew('${c.id}',this.checked)"> ${esc(c.name)}<div class="small">${esc(c.classification)} • ${(c.capabilities||[]).length} capabilities</div></label>`).join("")||"<div class='small'>Add employees in Crew.</div>"}</div></div>`;drawDetails()}
function assemblyHTML(a,ai){return`<div class="card" style="margin-top:10px"><div class="between"><div><b>Roof Assembly ${ai+1}</b><div class="small">${(+a.qty||0).toFixed(1)} squares</div></div><button onclick="delAssembly(${ai})">Delete</button></div><div class="grid two"><div><label>Assembly name</label><input id="an${ai}" value="${esc(a.name)}"></div><div><label>Quantity (squares)</label><input id="aq${ai}" type="number" value="${a.qty}"></div></div><div class="row" style="margin-top:8px"><button onclick="addOpToAssembly(${ai})">+ Add Installation Operation</button><button onclick="saveAssembly(${ai})">Save Assembly</button></div>${(a.operations||[]).map((o,oi)=>`<div class="op"><div class="grid two"><div><label>Installation operation</label><input id="aon${ai}_${oi}" value="${esc(o.name)}"><label>Attachment method</label><select id="aoa${ai}_${oi}">${ATT.map(v=>`<option ${v===o.attachment?"selected":""}>${v}</option>`).join("")}</select></div><div><label>Material layers included in this operation</label><div class="skillGrid">${LAY.map(v=>`<label><input type="checkbox" ${o.layers?.includes(v)?"checked":""} onchange="syncLayer(${ai},${oi},'${v}',this.checked)"> ${v}</label>`).join("")}</div><label>Material description</label><input id="aom${ai}_${oi}" value="${esc(o.material||"")}"></div></div><div class="small">Example: 2" ISO + 1.5" ISO can be one mechanically fastened installation operation.</div></div>`).join("")}</div>`}
function addAssembly(){S.projects.find(x=>x.id===S.selected).assemblies.push({name:"New Roof Assembly",qty:0,operations:[]});save();project()}
function delAssembly(i){S.projects.find(x=>x.id===S.selected).assemblies.splice(i,1);save();project()}
function addOpToAssembly(i){S.projects.find(x=>x.id===S.selected).assemblies[i].operations.push({name:"New Installation Operation",attachment:"Mechanically Fastened",layers:[],material:""});save();project()}
function syncLayer(ai,oi,v,on){let o=S.projects.find(x=>x.id===S.selected).assemblies[ai].operations[oi];o.layers=o.layers||[];if(on&&!o.layers.includes(v))o.layers.push(v);if(!on)o.layers=o.layers.filter(x=>x!==v);save()}
function saveAssembly(ai){let a=S.projects.find(x=>x.id===S.selected).assemblies[ai];a.name=$("an"+ai).value;a.qty=+$("aq"+ai).value;a.operations.forEach((o,oi)=>{o.name=$(`aon${ai}_${oi}`).value;o.attachment=$(`aoa${ai}_${oi}`).value;o.material=$(`aom${ai}_${oi}`).value});save();project()}
function saveInfo(){let p=S.projects.find(x=>x.id===S.selected);p.name=$("pn").value;p.number=$("pnum").value;p.address=$("pa").value;p.system=$("ps").value;p.contract=+$("pc").value;save();project()}
function saveHours(){let p=S.projects.find(x=>x.id===S.selected);p.laborHours=+$("lh").value;p.actualLaborHours=+$("alh").value;save();project()}
function uploadMap(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{S.projects.find(x=>x.id===S.selected).map=r.result;save();project()};r.readAsDataURL(f)}
function measureArea(){let p=S.projects.find(x=>x.id===S.selected),q=+prompt("Enter roof area in ROOFING SQUARES:");if(!q||q<0)return;p.details.push({type:"Roof Area",squares:q,x:10+Math.random()*65,y:10+Math.random()*70,w:22,h:12});save();project()}
function markArea(){let p=S.projects.find(x=>x.id===S.selected),q=+prompt("Completed roof area in ROOFING SQUARES:");if(!q||q<0)return;p.details.push({type:"Completed Area",squares:q,x:10+Math.random()*65,y:10+Math.random()*70,w:18,h:10});save();project()}
function dailySnapshot(){let p=S.projects.find(x=>x.id===S.selected),x=stats(p);p.snapshots=p.snapshots||[];p.snapshots.push({date:new Date().toISOString(),completed:x.done,total:x.total,pct:x.pct,finish:x.finish.toISOString(),hours:p.actualLaborHours});save();project();alert("Daily snapshot saved.")}
function addDetail(type){let p=S.projects.find(x=>x.id===S.selected),q=+prompt(type+" quantity (EA or LF):","1");if(q===null)return;p.details.push({type,qty:q,x:10+Math.random()*75,y:10+Math.random()*70});save();project()}
function drawDetails(){let p=S.projects.find(x=>x.id===S.selected),o=$("overlay");if(!o)return;o.innerHTML=p.details.map(d=>d.type==="Roof Area"?`<div class="area" style="left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%">${(+d.squares).toFixed(1)} squares</div>`:d.type==="Completed Area"?`<div class="area" style="left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%">${(+d.squares).toFixed(1)} sq complete</div>`:`<div class="detail" title="${esc(d.type)} • ${d.qty}" style="left:${d.x}%;top:${d.y}%">${d.type.split(" ").map(w=>w[0]).join("").slice(0,3)}</div>`).join("");let s=$("snapshotList");if(s)s.innerHTML=(p.snapshots||[]).slice(-5).reverse().map(v=>`Snapshot ${new Date(v.date).toLocaleDateString()}: ${(+v.completed).toFixed(1)} / ${(+v.total).toFixed(1)} squares (${(+v.pct).toFixed(0)}%) • predicted ${new Date(v.finish).toLocaleDateString()} • actual hours ${(+v.hours||0).toLocaleString()}`).join("<br>")}
function addOperation(){S.projects.find(x=>x.id===S.selected).operations.push({name:"New Production Operation",capability:"",qty:0,done:0,rate:8,cost:0});save();project()}
function saveOp(i){let p=S.projects.find(x=>x.id===S.selected),t=p.operations[i];t.name=$("on"+i).value;t.capability=$("oc"+i).value;t.qty=+$("oq"+i).value;t.done=+$("od"+i).value;t.rate=+$("or"+i).value;t.cost=+$("ocost"+i).value;save();project()}
function delOp(i){S.projects.find(x=>x.id===S.selected).operations.splice(i,1);save();project()}
function addCost(){S.projects.find(x=>x.id===S.selected).costs.push({name:"Material / Labor / Other",amount:0});save();project()}
function saveCost(i){let c=S.projects.find(x=>x.id===S.selected).costs[i];c.name=$("cn"+i).value;c.amount=+$("ca"+i).value;save();project()}
function delCost(i){S.projects.find(x=>x.id===S.selected).costs.splice(i,1);save();project()}
function toggleCrew(cid,on){let p=S.projects.find(x=>x.id===S.selected);p.crew=p.crew.filter(x=>x!==cid);if(on)p.crew.push(cid);save();project()}
function crew(){$("crew").innerHTML=`<div class="between"><div><h2>Crew & Employees</h2><div class="small">Capabilities are multi-select. Production is not entered directly for employees.</div></div><button class="primary" onclick="newCrew()">+ Employee</button></div><div class="grid">${S.crew.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="grid two"><div><label>Name</label><input id="n${c.id}" value="${esc(c.name)}"><label>Classification</label><select id="cl${c.id}">${Object.keys(CLASS_FACTORS).map(v=>`<option ${v===c.classification?"selected":""}>${v}</option>`).join("")}</select><label>Role</label><input id="r${c.id}" value="${esc(c.role)}"></div><div><label>Capabilities — select all that apply</label><div class="skillGrid">${CAPS.map(v=>`<label><input type="checkbox" ${c.capabilities?.includes(v)?"checked":""} onchange="skill('${c.id}',this)"> ${esc(v)}</label>`).join("")}</div></div></div><button style="margin-top:10px" onclick="saveCrew('${c.id}')">Save employee</button></div>`).join("")||"<div class='card small'>No employees yet.</div>"}</div>`}
function newCrew(){S.crew.push({id:id(),name:"New Employee",classification:"Journeyman",role:"Roofer",capabilities:[]});save();crew()}
function skill(cid,e){let c=S.crew.find(x=>x.id===cid);c.capabilities=c.capabilities||[];if(e.checked&&!c.capabilities.includes(e.nextSibling.textContent.trim()))c.capabilities.push(e.nextSibling.textContent.trim());if(!e.checked)c.capabilities=c.capabilities.filter(x=>x!==e.nextSibling.textContent.trim());save()}
function saveCrew(cid){let c=S.crew.find(x=>x.id===cid);c.name=$("n"+cid).value;c.classification=$("cl"+cid).value;c.role=$("r"+cid).value;save();crew()}
nav("dash");
</script></body></html>
