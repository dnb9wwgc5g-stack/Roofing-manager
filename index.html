<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commercial Roofing Production Manager</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212b;--muted:#66717d;--line:#d9dee5;--accent:#1769aa;--good:#16834a;--warn:#b87900;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{margin:.2em 0}.brand{font-weight:800}.small{font-size:12px;color:var(--muted)}
nav{position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;gap:4px;padding:7px;overflow:auto}
nav button{flex:1;min-width:74px;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-size:12px}
nav button.active{background:#e8f1f9;color:var(--accent);font-weight:700}
main{max-width:1200px;margin:auto;padding:14px 14px 90px}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px #00000008}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px;color:#48535e}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd6de;border-radius:9px;background:#fff;font:inherit}
button,.btn{border:1px solid #c8d0d8;background:#fff;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.good{background:#eaf7f0;color:var(--good);border-color:#bde4cc}.danger{color:var(--bad)}
.kpi{font-size:24px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef1f4;font-size:11px;margin:2px}
.progress{height:10px;background:#e7ebef;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}
.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
#mapWrap{position:relative;background:#111;border-radius:12px;overflow:hidden;min-height:320px}.mapStage{position:relative;width:100%;touch-action:none}
#mapCanvas{display:block;width:100%;height:auto;background:#eee}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.toolbar button.active{background:#dcecf8;border-color:#8ebce0}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.legend button{text-align:left}
.symbol{display:inline-flex;width:24px;height:24px;border-radius:5px;align-items:center;justify-content:center;background:#e9eef4;margin-right:5px;font-weight:800}
.muted{color:var(--muted)}.note{background:#fff8df;border:1px solid #f0dc93;padding:10px;border-radius:10px;font-size:13px}
@media(min-width:760px){.legend{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding-top:20px}}
</style>
</head>
<body>
<header><div><div class="brand">Commercial Roofing Production Manager</div><div class="small">MVP • local prototype</div></div><div id="saveState" class="small">Saved locally</div></header>
<main>
<section id="dashboard" class="page"></section>
<section id="jobs" class="page hidden"></section>
<section id="job" class="page hidden"></section>
<section id="crew" class="page hidden"></section>
<section id="learning" class="page hidden"></section>
</main>
<nav>
<button data-page="dashboard">Dashboard</button><button data-page="jobs">Jobs</button><button data-page="crew">Crew</button><button data-page="learning">Learning</button>
</nav>
<script>
const KEY='crpm_mvp_v1';
const defaultState={
 jobs:[], crew:[], selectedJob:null, learning:{}
};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState;
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saveState').textContent='Saved '+new Date().toLocaleTimeString();};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function nav(page){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(page).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render(page)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function uid(){return Math.random().toString(36).slice(2,10)}
function jobById(id){return S.jobs.find(j=>j.id===id)}
function daysBetween(a,b){return Math.max(0,(new Date(b)-new Date(a))/86400000)}
function jobStats(j){
 const done=j.activities.reduce((a,x)=>a+(+x.completed||0),0), total=j.activities.reduce((a,x)=>a+(+x.quantity||0),0);
 const pct=total?Math.min(100,done/total*100):0;
 const costActual=j.costs.reduce((a,x)=>a+(+x.amount||0),0);
 const remainingCost=j.activities.reduce((a,x)=>a+Math.max(0,(+x.quantity||0)-(+x.completed||0))*(+x.costPerUnit||0),0);
 const projectedCost=costActual+remainingCost;
 const profit=(+j.contract||0)-projectedCost, margin=j.contract?profit/j.contract*100:0;
 let remainingDays=0;
 j.activities.forEach(a=>{let rem=Math.max(0,(+a.quantity||0)-(+a.completed||0));let rate=effectiveRate(j,a);remainingDays=Math.max(remainingDays,rate?rem/rate:0)});
 const crewAdj=crewMultiplier(j);
 if(crewAdj>0) remainingDays/=crewAdj;
 const start=j.start||new Date().toISOString().slice(0,10);
 const completion=new Date(new Date(start).getTime()+(daysBetween(start,new Date().toISOString().slice(0,10))+remainingDays)*86400000);
 return {done,total,pct,costActual,remainingCost,projectedCost,profit,margin,remainingDays,completion};
}
function effectiveRate(j,a){
 let base=+a.rate||0;
 const relevant=S.crew.filter(c=>(j.crewIds||[]).includes(c.id));
 if(!relevant.length)return base;
 const rates=relevant.map(c=>((c.rates||{})[a.type]||0)).filter(x=>x>0);
 if(!rates.length)return base;
 return rates.reduce((x,y)=>x+y,0)/rates.length;
}
function crewMultiplier(j){
 const relevant=S.crew.filter(c=>(j.crewIds||[]).includes(c.id));
 if(!relevant.length)return 1;
 const vals=relevant.map(c=>+c.multiplier||1);
 return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function renderDashboard(){
 let active=S.jobs.filter(j=>j.status!=='Completed');
 const totalContract=active.reduce((a,j)=>a+(+j.contract||0),0);
 const totalProfit=active.reduce((a,j)=>a+jobStats(j).profit,0);
 document.getElementById('dashboard').innerHTML=`<div class="between"><div><h2>Dashboard</h2><div class="muted">Live commercial roofing production overview</div></div><button class="primary" onclick="newJob()">+ New Job</button></div>
 <div class="grid three" style="margin-top:12px"><div class="card"><div class="small">Active jobs</div><div class="kpi">${active.length}</div></div><div class="card"><div class="small">Contract value</div><div class="kpi">$${totalContract.toLocaleString()}</div></div><div class="card"><div class="small">Projected profit</div><div class="kpi">$${Math.round(totalProfit).toLocaleString()}</div></div></div>
 <div class="card" style="margin-top:12px"><h3>Projects</h3>${active.length?active.map(j=>{let st=jobStats(j);return `<div class="card" style="margin:8px 0"><div class="between"><div><b>${esc(j.name)}</b><div class="small">${esc(j.system||'Commercial roofing')} • ${esc(j.address||'')}</div></div><button onclick="openJob('${j.id}')">Open</button></div><div style="margin-top:8px"><div class="between"><span>${st.pct.toFixed(0)}% complete</span><span>Forecast ${st.completion.toLocaleDateString()}</span></div><div class="progress"><i style="width:${st.pct}%"></i></div></div></div>`}).join(''):'<div class="muted">No jobs yet. Create your first project.</div>'}</div>`;
}
function renderJobs(){
 document.getElementById('jobs').innerHTML=`<div class="between"><div><h2>Jobs</h2><div class="muted">Project records and production data</div></div><button class="primary" onclick="newJob()">+ New Job</button></div>
 <div class="grid" style="margin-top:12px">${S.jobs.map(j=>{let st=jobStats(j);return `<div class="card"><div class="between"><div><h3>${esc(j.name)}</h3><div class="small">${esc(j.number||'')} • ${esc(j.system||'')}</div></div><span class="pill">${esc(j.status||'In Progress')}</span></div><p class="small">${esc(j.address||'')}</p><div class="grid two"><div><b>${st.pct.toFixed(1)}%</b><div class="small">complete</div></div><div><b>$${Math.round(st.profit).toLocaleString()}</b><div class="small">projected profit</div></div></div><button style="margin-top:10px" onclick="openJob('${j.id}')">Open Project</button></div>`}).join('')}</div>`;
}
function newJob(){
 const j={id:uid(),name:'New Commercial Project',number:'',address:'',system:'TPO',contract:0,start:new Date().toISOString().slice(0,10),status:'In Progress',crewIds:[],activities:[],costs:[],details:[],map:null,snapshots:[]};
 S.jobs.push(j);S.selectedJob=j.id;save();openJob(j.id);
}
function openJob(id){S.selectedJob=id;save();nav('job')}
function renderJob(){
 const j=jobById(S.selectedJob); if(!j){nav('jobs');return}
 let st=jobStats(j);
 document.getElementById('job').innerHTML=`<div class="between"><div><h2>${esc(j.name)}</h2><div class="muted">${esc(j.number||'')} • ${esc(j.system||'')}</div></div><button onclick="nav('jobs')">Back</button></div>
 <div class="grid three" style="margin-top:12px"><div class="card"><div class="small">Completion</div><div class="kpi">${st.pct.toFixed(0)}%</div></div><div class="card"><div class="small">Forecast finish</div><div class="kpi">${st.completion.toLocaleDateString()}</div></div><div class="card"><div class="small">Projected profit</div><div class="kpi">$${Math.round(st.profit).toLocaleString()}</div><div class="small">${st.margin.toFixed(1)}% margin</div></div></div>
 <div class="card" style="margin-top:12px"><h3>Project information</h3><div class="grid two"><div><label>Project name</label><input id="jname" value="${esc(j.name)}"><label>Project number</label><input id="jnum" value="${esc(j.number)}"><label>Address</label><input id="jaddr" value="${esc(j.address)}"></div><div><label>Roof system</label><select id="jsys">${['TPO','PVC','EPDM','Modified Bitumen','BUR','Other'].map(x=>`<option ${x===j.system?'selected':''}>${x}</option>`).join('')}</select><label>Contract value</label><input id="jcontract" type="number" value="${j.contract}"><label>Start date</label><input id="jstart" type="date" value="${j.start}"></div></div><button class="primary" style="margin-top:10px" onclick="saveJobInfo()">Save project</button></div>
 <div class="card" style="margin-top:12px"><h3>Interactive overhead</h3><div class="note">Upload the aerial once. Draw completed areas or place commercial roofing details on top. The original image is kept separate from your editable progress layer.</div>
 <div class="toolbar"><input id="mapFile" type="file" accept="image/*" onchange="loadMap(event)"><button onclick="mapTool('select')">Select</button><button onclick="mapTool('paint')">Mark complete</button><button onclick="mapTool('erase')">Erase</button><button onclick="mapTool('detail')">Place detail</button><button onclick="snapshot()">Save daily snapshot</button></div>
 <div id="mapWrap"><canvas id="mapCanvas"></canvas></div>
 <div class="toolbar">${legendButtons()}</div>
 <div class="small">Current map: ${j.map?'uploaded and editable':'no overhead uploaded'} • ${j.details.length} placed details • ${j.snapshots.length} daily snapshots</div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><div class="between"><h3>Work activities</h3><button onclick="addActivity()">+ Add</button></div>${j.activities.map((a,i)=>`<div class="card" style="margin:8px 0"><div class="between"><b>${esc(a.name)}</b><button class="danger" onclick="delActivity(${i})">Delete</button></div><div class="grid two"><div><label>Type</label><input id="at${i}" value="${esc(a.type)}"><label>Quantity</label><input id="aq${i}" type="number" value="${a.quantity}"><label>Completed</label><input id="ac${i}" type="number" value="${a.completed}"></div><div><label>Unit</label><input id="au${i}" value="${esc(a.unit||'SF')}"><label>Base rate / day</label><input id="ar${i}" type="number" value="${a.rate}"><label>Cost / unit remaining</label><input id="ap${i}" type="number" value="${a.costPerUnit||0}"></div></div><button onclick="saveActivity(${i})">Save activity</button></div>`).join('')||'<div class="muted">Add quantities such as tear-off SF, insulation SF, membrane SF, flashing LF, drains EA, etc.</div>'}</div>
 <div class="card"><div class="between"><h3>Costs</h3><button onclick="addCost()">+ Add</button></div>${j.costs.map((c,i)=>`<div class="row" style="margin:8px 0"><input id="cn${i}" placeholder="Cost description" value="${esc(c.name)}"><input id="ca${i}" type="number" placeholder="$" value="${c.amount}"><button class="danger" onclick="delCost(${i})">×</button></div>`).join('')||'<div class="muted">Track labor, material, equipment, subcontractor and other actual costs.</div>'}<hr><div class="between"><span>Actual cost</span><b>$${st.costActual.toLocaleString()}</b></div><div class="between"><span>Forecast remaining</span><b>$${Math.round(st.remainingCost).toLocaleString()}</b></div><div class="between"><span>Projected final cost</span><b>$${Math.round(st.projectedCost).toLocaleString()}</b></div></div></div>
 <div class="card" style="margin-top:12px"><h3>Crew on project</h3><div class="legend">${S.crew.map(c=>`<label style="border:1px solid var(--line);padding:9px;border-radius:9px"><input type="checkbox" ${j.crewIds.includes(c.id)?'checked':''} onchange="toggleCrew('${c.id}',this.checked)"> ${esc(c.name)} <span class="small">${esc(c.role||'')}</span></label>`).join('')||'<div class="muted">Add employees in Crew.</div>'}</div></div>`;
 if(j.map) setTimeout(initCanvas,0);
}
function saveJobInfo(){let j=jobById(S.selectedJob);j.name=document.getElementById('jname').value;j.number=document.getElementById('jnum').value;j.address=document.getElementById('jaddr').value;j.system=document.getElementById('jsys').value;j.contract=+document.getElementById('jcontract').value;j.start=document.getElementById('jstart').value;save();renderJob()}
function addActivity(){let j=jobById(S.selectedJob);j.activities.push({name:'TPO membrane',type:'TPO membrane',quantity:0,completed:0,unit:'SF',rate:8000,costPerUnit:0});save();renderJob()}
function saveActivity(i){let j=jobById(S.selectedJob),a=j.activities[i];a.type=document.getElementById('at'+i).value;a.name=a.type;a.quantity=+document.getElementById('aq'+i).value;a.completed=+document.getElementById('ac'+i).value;a.unit=document.getElementById('au'+i).value;a.rate=+document.getElementById('ar'+i).value;a.costPerUnit=+document.getElementById('ap'+i).value;save();renderJob()}
function delActivity(i){jobById(S.selectedJob).activities.splice(i,1);save();renderJob()}
function addCost(){jobById(S.selectedJob).costs.push({name:'Material',amount:0});save();renderJob()}
function delCost(i){jobById(S.selectedJob).costs.splice(i,1);save();renderJob()}
function toggleCrew(id,on){let j=jobById(S.selectedJob);j.crewIds=j.crewIds.filter(x=>x!==id);if(on)j.crewIds.push(id);save();renderJob()}
function legendButtons(){return ['Roof drain','Overflow drain','Scupper','HVAC curb','Pipe penetration','Expansion joint','Walk pad','Edge metal','Pitch pocket','Skylight','Roof hatch','Custom detail'].map(x=>`<button onclick="chooseDetail('${x.replace(/'/g,"\\'")}')">＋ ${x}</button>`).join('')}
let tool='select', chosenDetail=null, canvas,ctx,img,scale=1;
function mapTool(t){tool=t;document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));event?.currentTarget?.classList.add('active')}
function chooseDetail(x){chosenDetail=x;tool='detail';alert('Tap the overhead where you want to place: '+x)}
function loadMap(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let j=jobById(S.selectedJob);j.map=r.result;save();renderJob()};r.readAsDataURL(f)}
function initCanvas(){
 const j=jobById(S.selectedJob);canvas=document.getElementById('mapCanvas');ctx=canvas.getContext('2d');img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;drawMap()};img.src=j.map;
 canvas.onpointerdown=ev=>{canvas.setPointerCapture(ev.pointerId);const p=pt(ev);if(tool==='paint'){paintStart=p}else if(tool==='erase'){eraseAt(p)}else if(tool==='detail'){placeDetail(p)}};
 canvas.onpointermove=ev=>{if(tool==='paint'&&paintStart){const p=pt(ev);ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#22a06b';ctx.fillRect(Math.min(p.x,paintStart.x),Math.min(p.y,paintStart.y),Math.abs(p.x-paintStart.x),Math.abs(p.y-paintStart.y));ctx.restore()}};
 canvas.onpointerup=ev=>{if(tool==='paint'&&paintStart){const p=pt(ev);let x=Math.min(p.x,paintStart.x),y=Math.min(p.y,paintStart.y),w=Math.abs(p.x-paintStart.x),h=Math.abs(p.y-paintStart.y);if(w>5&&h>5){j.details.push({id:uid(),type:'Completed area',x,y,w,h,status:'Complete',date:new Date().toISOString()});save()}paintStart=null;drawMap();renderJob()}};
}
let paintStart=null;
function pt(ev){let r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*canvas.width/r.width,y:(ev.clientY-r.top)*canvas.height/r.height}}
function drawMap(){if(!canvas||!img)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);let j=jobById(S.selectedJob);j.details.forEach(d=>{if(d.type==='Completed area'){ctx.save();ctx.globalAlpha=.32;ctx.fillStyle='#16834a';ctx.fillRect(d.x,d.y,d.w,d.h);ctx.restore();ctx.strokeStyle='#16834a';ctx.strokeRect(d.x,d.y,d.w,d.h)}else{ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#1769aa';ctx.lineWidth=Math.max(3,canvas.width/500);ctx.beginPath();ctx.arc(d.x,d.y,Math.max(12,canvas.width/90),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#18212b';ctx.font='bold '+Math.max(12,canvas.width/100)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.type.split(' ').map(w=>w[0]).join('').slice(0,3),d.x,d.y);ctx.restore()}})}
function placeDetail(p){let j=jobById(S.selectedJob);j.details.push({id:uid(),type:chosenDetail||'Custom detail',x:p.x,y:p.y,status:'Not started',date:null});save();drawMap();renderJob()}
function eraseAt(p){let j=jobById(S.selectedJob),idx=-1,best=1e9;j.details.forEach((d,i)=>{let dist=d.type==='Completed area'?Math.hypot(p.x-(d.x+d.w/2),p.y-(d.y+d.h/2)):Math.hypot(p.x-d.x,p.y-d.y);if(dist<best){best=dist;idx=i}});if(idx>=0&&best<canvas.width/12){j.details.splice(idx,1);save();drawMap();renderJob()}}
function snapshot(){let j=jobById(S.selectedJob),st=jobStats(j);j.snapshots.push({date:new Date().toISOString(),percent:st.pct,completion:st.completion.toISOString(),details:JSON.parse(JSON.stringify(j.details)),activities:JSON.parse(JSON.stringify(j.activities))});save();renderJob();alert('Daily progress snapshot saved.')}
function renderCrew(){
 document.getElementById('crew').innerHTML=`<div class="between"><div><h2>Crew & Skills</h2><div class="muted">Qualifications and production history</div></div><button class="primary" onclick="addCrew()">+ Employee</button></div>
 <div class="grid" style="margin-top:12px">${S.crew.map(c=>`<div class="card"><div class="between"><h3>${esc(c.name)}</h3><button class="danger" onclick="removeCrew('${c.id}')">Delete</button></div><div class="grid two"><div><label>Role</label><input id="cr${c.id}" value="${esc(c.role||'')}"><label>Overall multiplier</label><input id="cm${c.id}" type="number" step=".01" value="${c.multiplier||1}"></div><div><label>Skills / qualifications</label><textarea id="cs${c.id}" rows="4">${esc((c.skills||[]).join(', '))}</textarea></div></div><label>Task production rates (units/day; e.g. TPO membrane=8000)</label><input id="ct${c.id}" value="${esc(Object.entries(c.rates||{}).map(([k,v])=>k+'='+v).join(', '))}"><button style="margin-top:8px" onclick="saveCrew('${c.id}')">Save employee</button></div>`).join('')||'<div class="card muted">No employees yet.</div>'}`;
}
function addCrew(){S.crew.push({id:uid(),name:'New Employee',role:'Roofer',skills:[],rates:{},multiplier:1});save();renderCrew()}
function removeCrew(id){S.crew=S.crew.filter(c=>c.id!==id);S.jobs.forEach(j=>j.crewIds=j.crewIds.filter(x=>x!==id));save();renderCrew()}
function saveCrew(id){let c=S.crew.find(x=>x.id===id);c.role=document.getElementById('cr'+id).value;c.multiplier=+document.getElementById('cm'+id).value||1;c.skills=document.getElementById('cs'+id).value.split(',').map(x=>x.trim()).filter(Boolean);c.rates={};document.getElementById('ct'+id).value.split(',').forEach(pair=>{let [k,v]=pair.split('=');if(k&&+v)c.rates[k.trim()]=+v});save();renderCrew()}
function renderLearning(){
 let observations=[];
 S.jobs.forEach(j=>j.activities.forEach(a=>{if(a.completed>0)observations.push({job:j.name,type:a.type,completed:a.completed,rate:a.rate})}));
 document.getElementById('learning').innerHTML=`<h2>Continuous Learning</h2><div class="muted">The prototype compares planned rates with actual completed quantities. Future versions can add weather, delays, roof complexity and statistical confidence.</div>
 <div class="card" style="margin-top:12px"><h3>Current observations</h3>${observations.length?`<table><tr><th>Project</th><th>Task</th><th>Completed</th><th>Baseline/day</th><th>Actual vs baseline</th></tr>${observations.map(o=>{let ratio=o.rate?o.completed/o.rate:0;return `<tr><td>${esc(o.job)}</td><td>${esc(o.type)}</td><td>${o.completed.toLocaleString()}</td><td>${o.rate.toLocaleString()}</td><td>${ratio?ratio.toFixed(2)+'×':''}</td></tr>`}).join('')}</table>`:'<div class="muted">Daily activity entries will appear here as learning observations.</div>'}</div>
 <div class="card" style="margin-top:12px"><h3>Learning rules in this MVP</h3><ul><li>Crew-specific rates override the baseline activity rate when available.</li><li>Remaining duration uses the strongest current crew signal rather than a fixed generic industry rate.</li><li>Daily snapshots preserve historical project states.</li><li>Production rates are editable so your company remains in control of the standards.</li></ul><div class="note">For the production version, I recommend a backend learning service that stores every production observation and calculates confidence-weighted rates by task, roof system, crew, employee, and job conditions.</div></div>`;
}
function render(p){if(p==='dashboard')renderDashboard();if(p==='jobs')renderJobs();if(p==='job')renderJob();if(p==='crew')renderCrew();if(p==='learning')renderLearning()}
render('dashboard');
</script>
</body></html>
